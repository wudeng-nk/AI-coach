name: ai_coach
description: "AI Coach 智能培训系统"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State management
  flutter_bloc: ^9.1.0
  equatable: ^2.0.7

  # Network
  dio: ^5.7.0

  # Router
  go_router: ^14.8.0

  # Storage
  shared_preferences: ^2.3.0

  # UI
  flutter_screenutil: ^5.9.0
  fl_chart: ^0.70.0

  # Utils
  uuid: ^4.5.0
  intl: ^0.20.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
